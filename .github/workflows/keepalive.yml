name: Keep the club database awake

# Free Supabase projects pause after 7 days without use. This calls a tiny
# function in the database every 3 days so the app is always ready.
# Needs the repository variables SUPABASE_URL and SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
